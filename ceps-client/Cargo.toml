[package]
name = "ceps-client"
version.workspace = true
edition.workspace = true
description = "Native CEP-18 / CEP-78 / CEP-85 / CEP-95 client library for Casper."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
license-file.workspace = true

[lib]
name = "ceps_client"
path = "src/lib.rs"

[features]
default = ["client"]
# Full RPC / install / call client (pulls casper-rust-wasm-sdk).
client = ["schema", "dep:casper-rust-wasm-sdk", "dep:reqwest"]
# Declarative install + entrypoint arg schema only (no SDK / RPC).
schema = []

[dependencies]
casper-rust-wasm-sdk = { workspace = true, optional = true }
casper-types = { version = "7.1.1", default-features = false }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
hex.workspace = true
base64.workspace = true
blake2.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[dev-dependencies]
tokio.workspace = true
casper-rust-wasm-sdk.workspace = true

[[example]]
name = "cep18_install"
path = "examples/cep18_install.rs"
required-features = ["client"]

[[example]]
name = "cep85_install"
path = "examples/cep85_install.rs"
required-features = ["client"]

[[example]]
name = "cep78_install"
path = "examples/cep78_install.rs"
required-features = ["client"]

[[example]]
name = "cep95_install"
path = "examples/cep95_install.rs"
required-features = ["client"]
