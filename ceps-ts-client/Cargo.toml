[package]
name = "ceps-ts-client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
name = "ceps_ts_client"
path = "src/lib.rs"

[dependencies]
common = { path = "../common" }
wasm-bindgen = "*"
js-sys = "*"
gloo-utils = { version = "0.2", default-features = false, features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "*"
