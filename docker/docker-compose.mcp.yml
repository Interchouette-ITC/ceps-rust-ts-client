# Slim CEP MCP for Cursor/agents (HTTP :6790).
# Use: make mcp-http / make mcp-http-stop
services:
  ceps-mcp:
    image: ${CEPS_MCP_IMAGE:-interchouette/ceps-client-mcp:dev}
    container_name: ceps-client-mcp
    ports:
      - "6790:6790"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CEPS_MCP_ADDR: "0.0.0.0:6790"
      CEPS_RPC_URL: ${CEPS_RPC_URL:-http://host.docker.internal:11101}
      CEPS_SSE_URL: ${CEPS_SSE_URL:-http://host.docker.internal:18101/events}
      CEPS_CHAIN_NAME: ${CEPS_CHAIN_NAME:-casper-net-1}
      CEPS_WASM_ROOT: /opt/ceps/tests/wasm
      RUST_LOG: ${RUST_LOG:-warn}
    command: ["--http", "--listen", "0.0.0.0:6790"]
    restart: unless-stopped
