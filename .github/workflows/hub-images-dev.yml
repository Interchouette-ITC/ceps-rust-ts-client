# Tip CLI image (:dev). Push Hub + GHCR on every push to dev (and manual Run).
name: hub-images-dev

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

env:
  CARGO_TERM_COLOR: always
  IMAGE_TAG: dev

permissions:
  contents: read
  packages: write

jobs:
  build-push-dev:
    name: Build and push Hub/GHCR :dev
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ceps-rust-ts-client

    steps:
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
        working-directory: .

      - name: Checkout client
        uses: actions/checkout@v5
        with:
          path: ceps-rust-ts-client

      - name: Checkout rustSDK (path dep)
        uses: actions/checkout@v5
        with:
          repository: casper-ecosystem/casper-rust-wasm-sdk
          ref: dev
          path: rustSDK

      - name: Swatinem cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ceps-rust-ts-client -> target

      - uses: dtolnay/rust-toolchain@stable

      - name: Build stripped CLI
        run: make release-cli-bin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker CLI image
        run: make docker-build IMAGE_TAG=${{ env.IMAGE_TAG }}

      - name: Build Docker MCP image
        run: make docker-build-mcp IMAGE_TAG=${{ env.IMAGE_TAG }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push CLI to Docker Hub
        env:
          HUB_USER: ${{ secrets.DOCKER_USERNAME_ITC }}
        run: |
          make docker-tag IMAGE_TAG=${{ env.IMAGE_TAG }}
          make docker-push-hub IMAGE_TAG=${{ env.IMAGE_TAG }}

      - name: Push MCP to Docker Hub
        env:
          HUB_USER: ${{ secrets.DOCKER_USERNAME_ITC }}
        run: |
          make docker-tag-mcp IMAGE_TAG=${{ env.IMAGE_TAG }}
          make docker-push-mcp-hub IMAGE_TAG=${{ env.IMAGE_TAG }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push CLI to GHCR
        run: make docker-push-ghcr IMAGE_TAG=${{ env.IMAGE_TAG }}

      - name: Push MCP to GHCR
        run: make docker-push-mcp-ghcr IMAGE_TAG=${{ env.IMAGE_TAG }}
