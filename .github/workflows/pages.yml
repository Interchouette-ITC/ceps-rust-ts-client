# GitHub Pages: narrative docs + rustdoc under docs/.
name: pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    defaults:
      run:
        working-directory: ceps-rust-ts-client

    steps:
      - name: Checkout client
        uses: actions/checkout@v5
        with:
          path: ceps-rust-ts-client

      - name: Checkout rustSDK (path dep)
        uses: actions/checkout@v5
        with:
          repository: casper-ecosystem/casper-rust-wasm-sdk
          ref: dev
          path: rustSDK

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Doc
        run: |
          make doc-check
          make doc

      # Nested checkout leaves .git under ceps-rust-ts-client/; JamesIves expects
      # workspace-root git. peaceiris publishes from a path without that constraint.
      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ceps-rust-ts-client/docs
          commit_message: "Deploy documentation for ${{ github.ref_name }}"
