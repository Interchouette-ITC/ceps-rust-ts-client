name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-unit-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Checkout rustSDK (path dep)
        uses: actions/checkout@v4
        with:
          repository: casper-ecosystem/casper-rust-wasm-sdk
          path: ../rustSDK
          ref: 2.2.0

      - name: Fmt
        run: cargo fmt -- --check

      - name: Clippy
        run: |
          env -u CARGO_TARGET_DIR cargo clippy -p ceps-client --lib -- -D warnings
          env -u CARGO_TARGET_DIR cargo clippy -p cli --bins -- -D warnings
          env -u CARGO_TARGET_DIR cargo clippy -p ceps-wasm --lib -- -D warnings

      - name: Unit tests
        run: |
          env -u CARGO_TARGET_DIR cargo test -p ceps-client -- --test-threads=1
          env -u CARGO_TARGET_DIR cargo test -p ceps-wasm --lib -- --test-threads=1

      - name: Doc closet check
        run: make doc-check

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Pack nodejs (smoke)
        run: make nodejs

      - name: Vitest
        run: |
          cd tests/ts
          npm install
          npm test
