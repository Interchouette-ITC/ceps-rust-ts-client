# Tip-line PR / push gate. No Pages, no npm publish, no GitHub Releases.
name: ci-test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    defaults:
      run:
        working-directory: ceps-rust-ts-client

    steps:
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
        working-directory: .

      - name: Checkout client
        uses: actions/checkout@v5
        with:
          path: ceps-rust-ts-client

      - name: Checkout rustSDK (path dep)
        uses: actions/checkout@v5
        with:
          repository: casper-ecosystem/casper-rust-wasm-sdk
          ref: 2.2.0
          path: rustSDK

      - name: Checkout CEP-18 tip
        uses: actions/checkout@v5
        with:
          repository: gRoussac/cep18
          ref: ceps-client-test
          path: cep-18

      - name: Checkout CEP-78 tip
        uses: actions/checkout@v5
        with:
          repository: gRoussac/cep-78-enhanced-nft
          ref: ceps-client-test
          path: cep-78-enhanced-nft

      - name: Checkout CEP-85 tip
        uses: actions/checkout@v5
        with:
          repository: gRoussac/cep-85
          ref: ceps-client-test
          path: cep-1155

      - name: Swatinem cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ceps-rust-ts-client -> target

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Stage tip WASMs
        run: make wasm-from-ceps

      - name: Prepare NCTL asset mounts
        run: mkdir -p assets/users assets/faucet

      - name: Start Casper NCTL
        run: |
          docker run -d \
            --name casper-nctl \
            -p 11101-11105:11101-11105 \
            -p 14101-14105:14101-14105 \
            -p 18101-18105:18101-18105 \
            -p 25101-25105:25101-25105 \
            -p 28101-28105:28101-28105 \
            -v "$GITHUB_WORKSPACE/ceps-rust-ts-client/assets/users:/app/casper-nctl/assets/net-1/users/" \
            -v "$GITHUB_WORKSPACE/ceps-rust-ts-client/assets/faucet:/app/casper-nctl/assets/net-1/faucet/" \
            interchouette/casper-nctl-2-docker:dev

      - name: Wait for NCTL
        run: |
          echo "Waiting for RPC on 11101..."
          for i in {1..60}; do
            if nc -z localhost 11101; then
              echo "RPC up; waiting for keys..."
              sleep 45
              break
            fi
            sleep 2
          done
          nc -z localhost 11101 || { echo "RPC did not start"; exit 1; }

          echo "Waiting for SSE..."
          for i in {1..60}; do
            if curl --silent --max-time 2 http://127.0.0.1:18101/events | grep -q "ApiVersion"; then
              echo "SSE up"
              break
            fi
            sleep 2
          done
          curl --silent --max-time 2 http://127.0.0.1:18101/events | grep -q "ApiVersion" \
            || { echo "SSE did not start"; exit 1; }

      - name: Export NCTL user secrets
        run: |
          # WARNING: NCTL fixture keys are public once mounted in CI.
          {
            echo "SECRET_KEY_USER_1<<CEPS_PEM_EOF"
            cat ./assets/users/user-1/secret_key.pem
            echo "CEPS_PEM_EOF"
          } >> "$GITHUB_ENV"
          if [ -f ./assets/users/user-2/secret_key.pem ]; then
            {
              echo "SECRET_KEY_USER_2<<CEPS_PEM_EOF"
              cat ./assets/users/user-2/secret_key.pem
              echo "CEPS_PEM_EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Lint
        run: make check-lint

      - name: Unit tests
        run: make unit-test

      - name: Integration tests (NCTL)
        run: make integration-test

      - name: CLI smoke
        run: make e2e-test

      - name: Doc closet check
        run: make doc-check

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
