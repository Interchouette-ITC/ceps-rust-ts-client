[package]
name = "ceps-client-wasm"
version.workspace = true
edition.workspace = true
description = "wasm-bindgen CEP client for Node and browsers (same API as ceps-client; replaces per-CEP client-js)."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license-file.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "ceps_client_wasm"
path = "src/lib.rs"

[features]
default = ["client"]
# Full CEP client bindgen (RPC / install / call).
client = ["ceps-client/client", "schema"]
# Declarative arg schema only (no CEP*Client classes).
schema = ["ceps-client/schema"]

[dependencies]
ceps-client = { path = "../ceps-client", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde.workspace = true
serde_json.workspace = true
gloo-utils = { version = "0.2", default-features = false, features = ["serde"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "-all"]
