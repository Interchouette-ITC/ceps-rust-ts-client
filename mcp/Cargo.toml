[package]
name = "ceps-rust-ts-client-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "MCP server for ceps-rust-ts-client (stdio + Streamable HTTP): CEP-18/78/85/95 + contract WASM helpers"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license-file.workspace = true

[[bin]]
name = "ceps-rust-ts-client-mcp"
path = "src/main.rs"

[lib]
name = "ceps_rust_ts_client_mcp"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
ceps-client = { path = "../ceps-client" }
clap.workspace = true
hex.workspace = true
mcpkit = "0.7"
mcpkit-axum = "0.7"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
casper-rust-wasm-sdk.workspace = true
