[workspace]
members = [
  "ceps-client",
  "ceps-client-cli",
  "ceps-client-wasm",
  "mcp",
  "tests/rust",
]
default-members = ["ceps-client-cli", "ceps-client"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
description = "Unified Rust client for Casper CEP-18, CEP-78, CEP-85, and CEP-95 (library, CLI, and WASM packs for Node/web)."
readme = "README.md"
homepage = "https://github.com/Interchouette-ITC/ceps-rust-ts-client"
repository = "https://github.com/Interchouette-ITC/ceps-rust-ts-client"
authors = ["3099551+gRoussac@users.noreply.github.com"]
license-file = "LICENSE"

[workspace.dependencies]
casper-rust-wasm-sdk = { path = "../rustSDK", default-features = false, features = [
  "transaction",
  "contract",
  "helpers",
  "watcher",
  "SSE",
] }
thiserror = "2"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
url = "2"
hex = "0.4"
base64 = "0.22"
blake2 = "0.10"
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "time",
] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true

[patch.crates-io]
casper-client = { version = "5", git = "https://github.com/casper-ecosystem/casper-client-rs", branch = "dev" }
casper-types = { git = "https://github.com/casper-network/casper-node", tag = "v2.2.2" }
casper-binary-port = { git = "https://github.com/casper-network/casper-node", tag = "v2.2.2" }
casper-binary-port-access = { git = "https://github.com/gRoussac/casper-binary-port-client", branch = "casper_2.2.2" }
